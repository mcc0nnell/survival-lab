name: test

on:
  push:
  pull_request:

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: node --check functions/trader.js
      - run: node --check dist/app.js
      - run: node --check worker/src/index.js
      - run: node -e "import('./functions/trader.js')"
      - run: npm test
